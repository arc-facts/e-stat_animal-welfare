# 【一時的な調査用】出典URLの中身を取得して probe/ にコミットする。調査後に削除する。
name: Probe sources (temporary)

on:
  push:
    branches: ["claude/bold-lamport-bx0d0i"]
    paths: ["probe_args.txt", "scripts/probe_sources.py", ".github/workflows/probe-sources.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf openpyxl xlrd
      - run: |
          while IFS= read -r line; do
            [ -n "$line" ] && python scripts/probe_sources.py $line
          done < probe_args.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -m "probe: 出典の取得結果（一時）" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
