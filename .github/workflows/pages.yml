name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/animal-welfare-stats-graphs-fi6o3g]
  workflow_dispatch:
  # update-data.yml が確報値をコミットした後にも自動で再デプロイする。
  # （GitHub Actions の bot による push は push イベントを発火しないため、
  #  データ更新ワークフローの完了を workflow_run で受けて連鎖させる）
  workflow_run:
    workflows: ["Update data from e-Stat"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site data
        run: python scripts/build_site_data.py

      - name: Cache-bust static assets
        # index.html と app.js/style.css がブラウザ・CDNのキャッシュにより
        # 別バージョンの組み合わせで配信されると、要素IDの不整合等で
        # 実行時エラーになりうる。コミットSHAをクエリ文字列として付与し、
        # デプロイのたびに両者が必ずセットで再取得されるようにする。
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          sed -i "s/style\.css\"/style.css?v=$SHA_SHORT\"/" docs/index.html
          sed -i "s/app\.js\"/app.js?v=$SHA_SHORT\"/" docs/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
