# e-Stat から取得する統計表と、表の中から取り出す系列の定義。
#
# stats_data_id が空の場合、fetch_estat.py は search（getStatsList の検索条件）
# と title_regex で統計表を自動発見します。発見結果はログに出るので、確定したら
# stats_data_id に書き写すと以後の実行が安定します。
#
# match / exclude は、表の各行のラベル（全軸の label を連結した文字列）に対する
# 部分一致条件です。1つの年に複数行が残った場合はエラーになり、残った行の
# ラベル一覧が表示されるので、それを見て条件を絞り込んでください。

# ---------------------------------------------------------------- 飼養数
# 畜産統計調査（統計コード 00500222）の累年統計表（全国）

[series.layers_thousand]
file = "livestock.csv"
description = "採卵鶏 成鶏めす飼養羽数（種鶏を除く）"
stats_data_id = ""
title_regex = "採卵鶏.*(累年|飼養戸数・羽数)"
# 実際の行ラベル例（表0001884437）: "飼養羽数_採卵鶏（種鶏を除く）_成鶏めす（6ヶ月以上）"
# 「種鶏を除く」自体に「種鶏」という文字列を含むため、excludeで"種鶏"を使うと
# 目的の行まで消えてしまう。目的の語句をmatchで直接指定して一意に絞り込む。
match = ["成鶏めす（6ヶ月以上）", "採卵鶏（種鶏を除く）"]
exclude = ["1戸当たり", "１戸当たり"]
unit = "千羽"

[series.layers_thousand.search]
statsCode = "00500222"
searchWord = "採卵鶏 累年 飼養戸数 羽数"

[series.layer_farms]
file = "livestock.csv"
description = "採卵鶏 飼養戸数"
stats_data_id = ""
title_regex = "採卵鶏.*(累年|飼養戸数・羽数)"
# 行ラベル例: "001 飼養戸数"（総数）/ "002 飼養戸数_採卵鶏（種鶏のみの飼養者を除く）" /
# "003 飼養戸数_種鶏のみ"。総数だけを残すため下位区分を明示的に除外する。
match = ["飼養戸数"]
exclude = ["採卵鶏（種鶏のみ", "種鶏のみ", "1戸当たり", "１戸当たり"]
unit = "戸"

[series.layer_farms.search]
statsCode = "00500222"
searchWord = "採卵鶏 累年 飼養戸数 羽数"

[series.broilers_thousand]
file = "livestock.csv"
description = "ブロイラー 飼養羽数"
stats_data_id = ""
title_regex = "ブロイラー.*(累年|飼養戸数・羽数)"
title_exclude = ["規模別"]
# 行ラベル例: "002 飼養羽数" / "003 １戸当たりの飼養羽数"（"飼養羽数"を含む） /
# "005 対前年比_飼養羽数"（同じく"飼養羽数"を含む、単位％）。
# 両方を明示的に除外しないと"飼養羽数"だけでは複数行にマッチする。
match = ["飼養羽数"]
exclude = ["規模", "出荷", "1戸当たり", "１戸当たり", "対前年比"]
unit = "千羽"

[series.broilers_thousand.search]
statsCode = "00500222"
searchWord = "ブロイラー 累年 飼養戸数 羽数"

[series.broiler_farms]
file = "livestock.csv"
description = "ブロイラー 飼養戸数"
stats_data_id = ""
title_regex = "ブロイラー.*(累年|飼養戸数・羽数)"
title_exclude = ["規模別"]
match = ["飼養戸数"]
exclude = ["規模", "出荷", "1戸当たり", "１戸当たり", "対前年比"]
unit = "戸"

[series.broiler_farms.search]
statsCode = "00500222"
searchWord = "ブロイラー 累年 飼養戸数 羽数"

[series.pigs_thousand]
file = "livestock.csv"
description = "豚 飼養頭数（総数）"
stats_data_id = ""
title_regex = "豚.*(累年|飼養戸数・頭数)"
title_exclude = ["規模別"]
# 行ラベル例（表0001884287）: "003 飼養頭数_計"（目的の行）のほか
# "004 子取り用めす豚" "005 種おす豚" "006 肥育豚" "007 その他"
# "008〜011 6ヶ月未満/6ヶ月以上の内訳" "012 1戸当たり飼養頭数" が並ぶため、
# それらを漏れなく除外する。
match = ["飼養頭数"]
exclude = ["規模", "子取り", "肥育", "種おす", "経営タイプ", "小計", "その他", "6か月", "6カ月", "6ヶ月", "1戸当たり", "１戸当たり"]
unit = "千頭"

[series.pigs_thousand.search]
statsCode = "00500222"
searchWord = "豚 累年 飼養戸数 頭数"

[series.sows_thousand]
file = "livestock.csv"
description = "子取り用めす豚（母豚）頭数"
stats_data_id = ""
title_regex = "豚.*(累年|飼養戸数・頭数)"
title_exclude = ["規模別"]
# 行ラベル例: "004 飼養頭数_子取り用めす豚"（総数、目的の行）と
# "010 飼養頭数_6ヶ月以上_子取り用めす豚"（6ヶ月以上のみの内数）の
# 2つが"子取り用めす豚"にマッチするため、後者を除外して総数を残す。
match = ["子取り用めす豚"]
exclude = ["規模", "小計", "6か月", "6カ月", "6ヶ月", "1戸当たり", "１戸当たり", "戸数"]
unit = "千頭"

[series.sows_thousand.search]
statsCode = "00500222"
searchWord = "豚 累年 飼養戸数 頭数"

[series.pig_farms]
file = "livestock.csv"
description = "豚 飼養戸数"
stats_data_id = ""
title_regex = "豚.*(累年|飼養戸数・頭数)"
title_exclude = ["規模別"]
match = ["飼養戸数"]
exclude = ["規模", "経営タイプ", "子取り", "肥育", "小計", "1戸当たり", "１戸当たり"]
unit = "戸"

[series.pig_farms.search]
statsCode = "00500222"
searchWord = "豚 累年 飼養戸数 頭数"

# ---------------------------------------------------------------- 屠殺数
# 畜産物流通調査（統計コード 00500227）

[series.broilers_slaughtered_thousand]
file = "slaughter.csv"
description = "ブロイラー（肉用若鶏）処理羽数"
# 「食鳥流通累年統計 食鳥処理場調査（ブロイラー）処理量」— この表は
# 鳥種がタイトルで固定（行ラベルには"肉用若鶏"等の文字列は出てこない）。
# 行ラベル例: "100 羽数 100 全ての食鳥処理場 00000 全国 2017 ... yearly"
stats_data_id = ""
title_regex = "食鳥.*処理量.*ブロイラー"
title_exclude = ["規模別", "月別"]
match = ["羽数", "全国"]
exclude = ["重量", "規模", "戸数", "月別"]
unit = "千羽"

[series.broilers_slaughtered_thousand.search]
statsCode = "00500227"
searchWord = "食鳥 処理場調査 ブロイラー 処理量 累年"

[series.layers_culled_thousand]
file = "slaughter.csv"
description = "廃鶏（成鶏）処理羽数"
# ブロイラーと同じ調査の「成鶏」版の累年表を探す（存在すれば同じ行構造のはず）。
stats_data_id = ""
title_regex = "食鳥.*処理量.*成鶏"
title_exclude = ["規模別", "月別"]
match = ["羽数", "全国"]
exclude = ["重量", "規模", "戸数", "月別"]
unit = "千羽"

[series.layers_culled_thousand.search]
statsCode = "00500227"
searchWord = "食鳥 処理場調査 成鶏 処理量 累年"

[series.pigs_slaughtered_thousand]
file = "slaughter.csv"
description = "豚 と畜頭数"
stats_data_id = ""
title_regex = "と畜.*(累年|頭数)"
title_exclude = ["規模別", "と畜場数", "月別"]
match = ["豚"]
exclude = ["規模", "都道府県", "月別", "場数"]
unit = "千頭"

[series.pigs_slaughtered_thousand.search]
statsCode = "00500227"
searchWord = "と畜 累年"

# ---------------------------------------------------------------- 人口
# 人口推計（統計コード 00200524）

[series.population_thousand]
file = "population.csv"
description = "日本の総人口（各年10月1日現在）"
stats_data_id = ""
title_regex = "長期時系列|総人口"
match = ["総人口", "男女計"]
exclude = ["日本人人口", "都道府県", "月"]
unit = "千人"

[series.population_thousand.search]
statsCode = "00200524"
searchWord = "人口推計"
